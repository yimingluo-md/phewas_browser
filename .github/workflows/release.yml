name: Release build

# Builds the desktop app for macOS (Apple Silicon + Intel) and Windows.
# Runs on demand (Actions -> Release build -> Run workflow) and on version tags (v*).
# Signing/notarization is Phase 4: these builds are ad-hoc signed on macOS and unsigned on
# Windows, so macOS shows "cannot verify developer" (right-click -> Open, once).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       name: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, name: macos-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, name: windows-x64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Sidecar (PyInstaller)
        shell: bash
        run: scripts/build_sidecar.sh

      - name: Desktop app
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"   # ad-hoc until Phase 4 provides a Developer ID
        run: |
          npm ci
          npx tauri build --target ${{ matrix.target }} --ci

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          b=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          ls -R "$b" | head -50
          cp "$b"/dmg/*.dmg out/ 2>/dev/null || true
          cp "$b"/nsis/*.exe out/ 2>/dev/null || true
          if [ -d "$b/macos" ]; then (cd "$b/macos" && ditto -c -k --keepParent "PheWAS Browser.app" "$OLDPWD/out/PheWAS-Browser-${{ matrix.name }}.app.zip"); fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PheWAS-Browser-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
