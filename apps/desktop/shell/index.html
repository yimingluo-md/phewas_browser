<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PheWAS Browser</title>
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1c1f24; background: #f6f7f9; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .brand { font-size: 22px; font-weight: 700; }
  .brand span { font-weight: 400; color: #6b7280; margin-left: 6px; }
  .spinner { width: 28px; height: 28px; border: 3px solid #e3e6ea; border-top-color: #1f5fbf; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: #6b7280; }
  .error { display: none; max-width: 640px; padding: 12px 16px; background: #fde8e6; color: #b3261e; border: 1px solid #f5c2bd; border-radius: 8px; white-space: pre-wrap; }
  .ruo { position: fixed; bottom: 14px; color: #b3261e; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">PheWAS<span>Browser</span></div>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Starting the data server…</div>
  <div class="error" id="error"></div>
</div>
<div class="ruo">Research Use Only — contains sensitive data; do not disseminate.</div>
<script>
  window.__phewasError = function (text) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").textContent = "The application could not start.";
    var e = document.getElementById("error");
    e.textContent = text;
    e.style.display = "block";
  };
</script>
</body>
</html>
