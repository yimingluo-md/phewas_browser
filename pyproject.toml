[project]
name = "phewas-browser"
version = "0.5.0"
description = "Local browser for variant-level PheWAS summary statistics (FastAPI + DuckDB)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — Research Use Only" }
authors = [{ name = "Yiming Luo", email = "yl3232@cumc.columbia.edu" }]
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "phewas-core",
    "phewas-server",
]

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",        # FastAPI TestClient transport (starlette >= 1.6)
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# The desktop sidecar is built from this workspace and uv.lock.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
phewas-core = { workspace = true }
phewas-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:phewas.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["macos", "windows", "dist", "benchmarks", "apps/desktop/src-tauri/sidecar", ".build", "tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["E501"]  # long SQL strings

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages"]
ignore_missing_imports = true
