[project]
name = "phewas-core"
version = "0.5.0"
description = "Dataset library, import pipeline and query layer for the PheWAS Browser (no web dependencies)."
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.5"]

[project.scripts]
phewas = "phewas_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phewas_core"]
